<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noctara | Feed</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background: #080808; color: white; margin: 0; font-family: 'Inter', sans-serif;">

    <nav style="display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid #1a1a1a;">
        <h2 style="letter-spacing: 5px; font-weight: 200; margin: 0;">NOCTARA</h2>
        <div style="display: flex; align-items: center; gap: 20px;">
            <div id="userProfile" style="display: flex; align-items: center; gap: 10px;">
                <img id="avatarImg" src="https://via.placeholder.com/40" style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid #333; object-fit: cover;">
                <span id="userEmail" style="font-size: 14px; color: #888;">...</span>
            </div>
            <button id="logoutBtn" style="background: transparent; color: #ff4d4d; border: 1px solid #441a1a; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 12px;">Logout</button>
        </div>
    </nav>

    <div class="stories-container" style="display: flex; gap: 15px; padding: 20px 40px; overflow-x: auto; scrollbar-width: none;">
        <div class="story-add" style="min-width: 70px; height: 70px; border-radius: 50%; border: 2px dashed #333; display: flex; align-items: center; justify-content: center; cursor: pointer;">+</div>
        <div id="storyList" style="display: flex; gap: 15px;"></div>
    </div>

    <main style="max-width: 600px; margin: 0 auto; padding: 20px;">
        <div class="shine-card" style="background: #111; border: 1px solid #222; border-radius: 20px; padding: 30px; text-align: center;">
            <h3 style="font-weight: 300; color: #888;">YOUR SHINE</h3>
            <div id="shineDisplay" style="font-size: 48px; font-weight: 700; margin: 10px 0;">0</div>
            <button id="increaseShine" style="background: white; color: black; border: none; padding: 12px 30px; border-radius: 25px; font-weight: 600; cursor: pointer; transition: 0.3s;">Increase Shine</button>
        </div>

        <div id="postFeed" style="margin-top: 30px;">
            <p style="color: #444; text-align: center; font-size: 14px;">Your feed is quiet... for now.</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
