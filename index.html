<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noctara | Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background: #080808; color: white; margin: 0; font-family: 'Inter', sans-serif;">

    <nav style="display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid #1a1a1a;">
        <h2 style="letter-spacing: 5px; font-weight: 200; margin: 0;">NOCTARA</h2>
        <div style="display: flex; align-items: center; gap: 20px;">
            <div id="userProfile" style="display: flex; align-items: center; gap: 10px;">
                <img id="avatarImg" src="https://via.placeholder.com/40" style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid #333; object-fit: cover;">
            </div>
            <button id="logoutBtn" style="background: transparent; color: #ff4d4d; border: 1px solid #441a1a; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 12px;">Logout</button>
        </div>
    </nav>

    <div class="stories-container" style="display: flex; gap: 20px; padding: 30px 40px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #111;">
        <div id="storyList" style="display: flex; gap: 20px;">
            
            <div style="text-align: center; min-width: 75px;">
                <div style="width: 65px; height: 65px; border-radius: 50%; padding: 3px; border: 2px solid #fff; cursor: pointer;">
                    <img id="storyAvatar" src="https://via.placeholder.com/150" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
                </div>
                <p style="font-size: 11px; margin-top: 8px; color: #777; letter-spacing: 1px;">YOU</p>
            </div>

            <div style="text-align: center; min-width: 75px;">
                <div style="width: 65px; height: 65px; border-radius: 50%; padding: 3px; border: 2px solid #333; cursor: pointer;">
                    <img src="https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?w=200" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
                </div>
                <p style="font-size: 11px; margin-top: 8px; color: #777; letter-spacing: 1px;">VOID</p>
            </div>

            <div style="text-align: center; min-width: 75px;">
                <div style="width: 65px; height: 65px; border-radius: 50%; padding: 3px; border: 2px solid #333; cursor: pointer;">
                    <img src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=200" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
                </div>
                <p style="font-size: 11px; margin-top: 8px; color: #777; letter-spacing: 1px;">NEON</p>
            </div>

            <div style="text-align: center; min-width: 75px;">
                <div style="width: 65px; height: 65px; border-radius: 50%; padding: 3px; border: 2px solid #333; cursor: pointer;">
                    <img src="https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?w=200" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
                </div>
                <p style="font-size: 11px; margin-top: 8px; color: #777; letter-spacing: 1px;">ECHO</p>
            </div>

        </div>
    </div>

    <main style="max-width: 600px; margin: 50px auto; padding: 20px;">
        <div class="shine-card" style="background: #111; border: 1px solid #222; border-radius: 30px; padding: 50px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
            <p style="color: #444; letter-spacing: 3px; font-size: 12px; margin-bottom: 10px;">CURRENT SHINE</p>
            <h1 id="shineDisplay" style="font-size: 80px; font-weight: 800; margin: 0;">0</h1>
            <button id="increaseShine" style="background: white; color: black; border: none; padding: 15px 40px; border-radius: 30px; font-weight: 700; cursor: pointer; margin-top: 30px; transition: 0.3s; letter-spacing: 1px;">COLLECT SHINE</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
