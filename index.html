<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noctara | Home</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #080808; color: white; margin: 0; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid #1a1a1a; position: sticky; top: 0; background: #080808; z-index: 100; }
        .stories-wrapper { display: flex; gap: 20px; padding: 30px 40px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #111; }
        .story-item { text-align: center; min-width: 75px; cursor: pointer; }
        .story-circle { width: 65px; height: 65px; border-radius: 50%; padding: 3px; border: 2px solid #333; transition: 0.3s; }
        .story-circle:hover { border-color: #fff; transform: scale(1.05); }
        .story-circle img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .story-name { font-size: 11px; margin-top: 8px; color: #777; letter-spacing: 1px; }
        .shine-section { max-width: 500px; margin: 50px auto; text-align: center; padding: 0 20px; }
        .shine-card { background: linear-gradient(145deg, #111, #0a0a0a); border: 1px solid #222; border-radius: 30px; padding: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        #increaseShine { background: #fff; color: #000; border: none; padding: 15px 40px; border-radius: 30px; font-weight: 700; cursor: pointer; margin-top: 20px; transition: 0.3s; letter-spacing: 1px; }
        #increaseShine:active { transform: scale(0.95); }
        #logoutBtn { background: none; border: 1px solid #333; color: #555; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-size: 12px; transition: 0.3s; }
        #logoutBtn:hover { border-color: #ff4d4d; color: #ff4d4d; }
    </style>
</head>
<body>

    <nav>
        <h2 style="letter-spacing: 6px; font-weight: 200; margin: 0;">NOCTARA</h2>
        <div style="display: flex; align-items: center; gap: 15px;">
            <img id="avatarImg" src="https://via.placeholder.com/40" style="width: 35px; height: 35px; border-radius: 50%; border: 1px solid #333;">
            <button id="logoutBtn">Logout</button>
        </div>
    </nav>

    <div class="stories-wrapper" id="storyList">
        </div>

    <div class="shine-section">
        <div class="shine-card">
            <p style="color: #444; letter-spacing: 3px; font-size: 12px; margin-bottom: 10px;">CURRENT SHINE</p>
            <h1 id="shineDisplay" style="font-size: 72px; margin: 0; font-weight: 800;">0</h1>
            <button id="increaseShine">COLLECT SHINE</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
