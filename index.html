<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noctara | Home</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ALL THE STYLES GO HERE SO THEY NEVER BREAK */
        body { background: #000; color: white; margin: 0; font-family: 'Inter', -apple-system, sans-serif; overflow-x: hidden; }
        
        nav { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 25px; border-bottom: 1px solid #111; 
            position: sticky; top: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 100;
        }

        .stories-wrapper { 
            display: flex; gap: 20px; padding: 25px; 
            overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #111;
            min-height: 100px;
        }
        .stories-wrapper::-webkit-scrollbar { display: none; }

        .story-item { text-align: center; min-width: 70px; }
        .story-circle { 
            width: 60px; height: 60px; border-radius: 50%; padding: 2px; 
            border: 2px solid #333; margin-bottom: 8px;
        }
        .story-circle img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .story-name { font-size: 10px; color: #666; letter-spacing: 1px; text-transform: uppercase; }

        .shine-section { 
            display: flex; justify-content: center; align-items: center; 
            padding: 60px 20px; flex-direction: column;
        }
        .shine-card { 
            background: #0a0a0a; border: 1px solid #1a1a1a; 
            border-radius: 24px; padding: 50px 20px; text-align: center; 
            width: 100%; max-width: 350px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }

        #shineDisplay { font-size: 80px; font-weight: 800; margin: 10px 0; letter-spacing: -2px; }
        
        #increaseShine { 
            background: #fff; color: #000; border: none; 
            padding: 16px 32px; border-radius: 30px; 
            font-weight: 700; cursor: pointer; width: 80%;
            transition: 0.2s; letter-spacing: 1px;
        }
        #increaseShine:active { transform: scale(0.95); }

        #logoutBtn { 
            background: none; border: 1px solid #222; color: #444; 
            padding: 6px 15px; border-radius: 20px; font-size: 11px; cursor: pointer;
        }
    </style>
</head>
<body>

    <nav>
        <div style="letter-spacing: 4px; font-weight: 200; font-size: 14px;">NOCTARA</div>
        <div style="display: flex; align-items: center; gap: 12px;">
            <img id="avatarImg" src="https://via.placeholder.com/150" style="width: 30px; height: 30px; border-radius: 50%; border: 1px solid #222;">
            <button id="logoutBtn">LOGOUT</button>
        </div>
    </nav>

    <div class="stories-wrapper" id="storyList">
        </div>

    <div class="shine-section">
        <div class="shine-card">
            <p style="color: #333; letter-spacing: 2px; font-size: 10px; margin: 0;">CURRENT SHINE</p>
            <h1 id="shineDisplay">0</h1>
            <button id="increaseShine">COLLECT SHINE</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://bbixsobnhcoyikvodxdg.supabase.co";
        const SUPABASE_ANON_KEY = "EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJiaXhzb2JuaGNveWlrdm9keGRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3Njc2MTQsImV4cCI6MjA5NDM0MzYxNH0.Ogx2agY-KVRKoRnl4kYhJy5G4_da0rqzRgIxqRr52TM";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentShine = 0;

        async function init() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) { window.location.href = "login.html"; return; }

            if (user.user_metadata.avatar_url) {
                document.getElementById('avatarImg').src = user.user_metadata.avatar_url;
            }

            renderStories(user);
            loadUserData(user.id);
        }

        function renderStories(user) {
            const avatar = user.user_metadata.avatar_url || "https://via.placeholder.com/150";
            const stories = [
                { name: "You", img: avatar },
                { name: "Void", img: "https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?w=200" },
                { name: "Neon", img: "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=200" },
                { name: "Echo", img: "https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?w=200" }
            ];

            document.getElementById('storyList').innerHTML = stories.map(s => `
                <div class="story-item">
                    <div class="story-circle"><img src="${s.img}"></div>
                    <div class="story-name">${s.name}</div>
                </div>
            `).join('');
        }

        async function loadUserData(userId) {
            const { data } = await supabase.from('profiles').select('shine_points').eq('id', userId).single();
            if (data) { currentShine = data.shine_points; updateUI(); }
        }

        function updateUI() { document.getElementById('shineDisplay').innerText = currentShine; }

        document.getElementById('increaseShine').onclick = async () => {
            currentShine++;
            updateUI();
            const { data: { user } } = await supabase.auth.getUser();
            await supabase.from('profiles').update({ shine_points: currentShine }).eq('id', user.id);
        };

        document.getElementById('logoutBtn').onclick = async () => {
            await supabase.auth.signOut();
            window.location.href = "login.html";
        };

        init();
    </script>
</body>
</html>
