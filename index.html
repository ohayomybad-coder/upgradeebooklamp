<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Noctara</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="logo">NOCTARA</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="#">Library</a>
      <a href="upload.html">Upload</a>
      <a href="profile.html">Profile</a>
      <a href="login.html" id="login-link">Login</a>
    </div>
  </nav>

  <section class="books-section" style="margin-top: 100px;">
    <div class="section-top">
      <h2>Discover Stories</h2>
      <input type="text" placeholder="Search stories..." class="search-bar">
    </div>

    <div class="genres">
      <button class="genre-btn active">All</button>
      <button class="genre-btn">Fantasy</button>
      <button class="genre-btn">Horror</button>
      <button class="genre-btn">Philosophy</button>
    </div>

    <div class="books-grid">
      <a href="book.html" class="book-link">
        <div class="book-card">
          <div class="image-wrapper">
            <img src="https://images.unsplash.com/photo-1512820790803-83ca734da794?q=80&w=1200&auto=format&fit=crop" alt="Book Cover">
          </div>
          <div class="book-info">
            <h3>Whispers Beyond Rain</h3>
            <p>A melancholic journey through forgotten memories.</p>
            <span>12 Chapters</span>
          </div>
        </div>
      </a>
      </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
