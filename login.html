<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | Noctara</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <section class="auth-section">
    <div class="auth-container">
      <p class="auth-label">WELCOME BACK</p>
      <h1>Enter Noctara</h1>
      <form class="auth-form" onsubmit="event.preventDefault();">
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="name@email.com" required>
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="button" class="login-btn" onclick="handleLogin()">Login</button>
        <button type="button" class="github-btn" onclick="loginWithGitHub()">Continue with GitHub</button>
      </form>
      <p class="signup-text">Don't have an account? <a href="#">Sign up</a></p>
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
