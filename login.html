<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | Noctara</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="auth-container">
    <h1>Enter Noctara</h1>
    <div class="input-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="name@example.com">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>
    <button type="button" class="login-btn" id="loginBtn">Login</button>
    <button type="button" class="github-btn" id="githubBtn">Continue with GitHub</button>
  </div>

  <script>
    const SUPABASE_URL = "https://xynifkjnvxcybhnkfqka.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5bmlma2pudnhjeWJobmtmcWthIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3NDczNTYsImV4cCI6MjA5NDMyMzM1Nn0.DIcLUpP5XtTTTmBCLveZ-sxUyIwRd9QBPct79LTmXQk";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // GITHUB LOGIN
    document.getElementById('githubBtn').addEventListener('click', async () => {
      // This tells Supabase EXACTLY where to go back to based on your screenshot
      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'github',
        options: {
          redirectTo: 'https://ohayomybad-coder.github.io/upgradeebooklamp/index.html'
        }
      });
      if (error) alert("GitHub Error: " + error.message);
    });

    // EMAIL LOGIN
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) alert("Login Error: " + error.message);
      else window.location.href = "index.html";
    });
  </script>
</body>
</html>
