<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Login</title>

  <link rel="stylesheet" href="style.css"/>

  <!-- Supabase SDK (MUST BE FIRST) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">

</head>

<body>

  <section class="auth-section">

    <div class="auth-container">

      <p class="auth-label">WELCOME BACK</p>

      <h1>Enter Noctara</h1>

      <p class="auth-description">
        Continue reading immersive stories and publish your imagination.
      </p>

      <form class="auth-form">

        <div class="input-group">
          <label>Email</label>
          <input type="email" placeholder="Enter your email">
        </div>

        <div class="input-group">
          <label>Password</label>
          <input type="password" placeholder="Enter your password">
        </div>

        <button type="button" class="login-btn" onclick="handleLogin()">
          Login
        </button>

        <button type="button" class="github-btn" onclick="loginWithGitHub()">
          Continue with GitHub
        </button>

      </form>

    </div>

  </section>

  <!-- YOUR JS FILE (MUST BE LAST) -->
  <script src="script.js"></script>

</body>
</html>
