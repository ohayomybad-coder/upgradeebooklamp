<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Login</title>

  <link rel="stylesheet" href="style.css"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

  <section class="auth-section">

    <div class="auth-container">

      <p class="auth-label">
        WELCOME BACK
      </p>

      <h1>
        Enter Noctara
      </h1>

      <p class="auth-description">
        Continue reading immersive stories and publish
        worlds of your own imagination.
      </p>

      <form class="auth-form">

        <div class="input-group">

          <label>Email</label>

          <input
            type="email"
            placeholder="Enter your email"
          >

        </div>

        <div class="input-group">

          <label>Password</label>

          <input
            type="password"
            placeholder="Enter your password"
          >

        </div>

        <div class="auth-options">

          <label class="remember-box">

            <input type="checkbox">

            <span>Remember me</span>

          </label>

          <a href="#">
            Forgot Password?
          </a>

        </div>

        <button class="login-btn" type="button" onclick="handleLogin()">
  Login
</button>
      </form>

      <p class="signup-text">

        Don’t have an account?

        <a href="#">
          Create one
        </a>

      </p>

    </div>

  </section>

</body>
</html>
