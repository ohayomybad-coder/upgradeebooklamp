<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | Noctara</title>
  <link rel="stylesheet" href="style.css"/>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
  <section class="auth-section">
    <div class="auth-container">
      <p class="auth-label">WELCOME BACK</p>
      <h1>Enter Noctara</h1>
      <p class="auth-description">
        Continue reading immersive stories and publish your imagination.
      </p>

      <form class="auth-form" onsubmit="event.preventDefault();">
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="Enter your email" required>
        </div>

        <div class="input-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Enter your password" required>
        </div>

        <div class="auth-options">
          <label class="remember-box">
            <input type="checkbox"> Remember me
          </label>
          <a href="#">Forgot Password?</a>
        </div>

        <button type="button" class="login-btn" onclick="handleLogin()">
          Login
        </button>

        <button type="button" class="github-btn" onclick="loginWithGitHub()">
          Continue with GitHub
        </button>
      </form>

      <p class="signup-text" style="margin-top: 30px; color: #8f8f8f; text-align: center;">
        Don't have an account? <a href="#" style="color: white; text-decoration: none; font-weight: 600;">Sign up</a>
      </p>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
